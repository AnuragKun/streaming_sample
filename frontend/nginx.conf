server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files (JS, CSS, images)
    location / {
        try_files $uri $uri/ /index.html;
        # ↑ If the file doesn't exist, serve index.html
        # This is required for client-side routing (React Router)
        # Without this, refreshing on /videos/123 would return 404
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:8000;
        # ↑ "backend" is the service name in docker-compose
        # Docker's internal DNS resolves it to the backend container's IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Increase timeout for video uploads (large files take time)
        proxy_read_timeout 300s;
        client_max_body_size 500M;
    }
}
